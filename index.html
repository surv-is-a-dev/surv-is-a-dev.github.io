    <script defer>(() => {
      function copyText(TEXT) {
        if (navigator.clipboard.writeText) navigator.clipboard.writeText(TEXT);
        // https://github.com/surv-is-a-dev/gallery/blob/main/site-files/include/generator.js#L384C1-L404C8
        const active = document.activeElement || document.querySelector('*:focus');
        const input = document.createElement('input');
        input.value = TEXT;
        input.style.top = '0px';
        input.style.left = '0px';
        input.style.position = 'fixed';
        document.body.appendChild(input);
        input.focus();
        input.select();
        try {
          document.execCommand('copy');
        } catch {}
        input.blur();
        document.body.removeChild(input);
        if (active) active.focus();
        input.remove();
      }
      let links, linkmaps, start;
      function writeLinks(lnks) {
        deleteLinkNodes();
        links = lnks;
        generateLinkNodes();
        start = Date.now();
        step();
      }
      const FACTS = ['I know latin!',
                     'I prefer cat girls, but dogs vs cats depends.',

                     'I love the forest',
                     'I hate chocolate',

                    ];
      const linkfns = {
        ['main']: () => {
          window.location.hash = '#';
          writeLinks([
                       [
                       //[25,  '25 ', '#main/about'],
                       [50,  'miyo.icu ', 'https://miyo.icu/'],
                       //[75,  '75 ', '#main/about'],
                       //[100, '100', '#main/about'],
                       ],
                       [
                       //[25,  '25 ', '#main/about'],
                       [50,  'about me ', '#main/about'],
                       //[75,  '75 ', '#main/about'],
                       //[100, '100', '#main/about'],
                       ],
                       [
                       //[25,  '25 ', '#main/about'],
                       [50,  'socials', '#main/socials'],
                       //[75,  '75 ', '#main/about'],
                       //[100, '100', '#main/about'],
                       ],
                     ]);
        },
        ['main/about']: () => {
          window.location.hash = '#about'
          document.getElementById('about').showModal();
          document.getElementById('randomfact').textContent = FACTS[Math.floor(Math.random() * FACTS.length)];
        },
        ['...jeffalo']: () => alert('haha it broken :3'),
        ['main/socials']: () => {
          window.location.hash = '#socials';
          writeLinks([
                       [
                       [10,  'RiotGames', '#socials/riotgames'],
                       [20,  'StackOverflow', 'http://l.miyo.icu/8742451'],
                       [25,  'GitHub', 'http://l.miyo.icu/874245112659479'],
                       [35,  'Reddit', 'http://l.miyo.icu/874245112659480'],
                       [50,  'miyo.icu', 'https://miyo.icu/'],
                       [65,  'wasteof', '#...jeffalo'/*https://wasteof.money/ya/*/],
                       [75,  'Gravatar', 'http://l.miyo.icu/874245112659481'],
                       [80,  'Vimeo', 'http://l.miyo.icu/874245112659482'],
                       [90,  'Tumblr', 'http://l.miyo.icu/874245112659483'],
                       [100, 'LinkedIn', 'http://l.miyo.icu/874245112659484'],
                       ],
                       [
                       [10,  'GitLab', 'http://l.miyo.icu/874245112659485'],
                       [25,  'Twitch', 'http://l.miyo.icu/874245112659486'],
                       [35,  'Disqus', 'http://l.miyo.icu/874245112659487'],
                       [50,  'Youtube', 'http://l.miyo.icu/874245112659488'],
                       [65,  'BlueSky', 'http://l.miyo.icu/874245112659489'],
                       [75,  'Scratch', 'http://l.miyo.icu/874245112659490'],
                       [90,  'Mastadon', 'http://l.miyo.icu/874245112659491'],
                       [100, 'GameJolt', 'http://l.miyo.icu/874245112659492'],
                       ],
                       [
                       //[25,  '25 ', '#main/about'],
                       [50,  'BACK', '#main'],
                       //[75,  '75 ', '#main/about'],
                       [100, 'Discord', '#socials/discord'],
                       ],
                     ]);
        },
        ['socials/riotgames']: () => {
          copyText('miyosho#chan');
          alert('Copied miyosho#chan to the clipboard!');
        },
        ['socials/discord']: () => {
          copyText('yri5');
          alert('Copied yri5 to the clipboard! (dms are open for non-mean people fr)');
        },
      };
    
      const canvas = document.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      
      function drawPercentageCircle(ctx, centerX, centerY, radius, percentage) {
        const endAngle = (percentage / 100) * 2 * Math.PI;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, endAngle, false);
        // ctx.lineTo(centerX, centerY);
        // ctx.fill();
        ctx.stroke();
      }
      
      const duration = 1552;
      
      function circle(start, r) {
        const now = Date.now();
        if (now < start) return 0;
        let percent = (now - start) / duration * 100;
        if (percent > 100) percent = 100;
        drawPercentageCircle(ctx, 250, 250, r, percent);
        return percent;
      }
      const crv = [(canvas.width / 2) - 5, 0, 0];
      crv[1] = (crv[0] / 2);
      crv[2] = (crv[0] / 2 / 2);
      const cto = [0, 0, 0];
      cto[1] = (cto[0] + 120);
      cto[2] = (cto[1] + 240);

      ctx.strokeStyle = 'white';
      // ctx.fillStyle = 'blue';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      function step() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let p = 0;
        for (let i = 0; i < 3; ++i) {
          p = circle(start + cto[i], crv[i]);
          const keys = Object.keys(linkmaps[i]);
          for (const key of keys) {
            if (p < +key) continue;
            linkmaps[i][key].style.visibility = 'visible';
            linkmaps[i][key].style.opacity = 1.0;
            delete linkmaps[i][key];
          }
        }
        if (p < 100) requestAnimationFrame(step);
        else after();
      }
      
      const name = document.querySelector('div.name');
      const pfp = document.querySelector('img.pfp');
      function after() {
        pfp.parentElement.style.visibility = 'visible';
        pfp.style.opacity = 1.0;
        name.style.opacity = 1.0;
      }

      const PI2 = Math.PI * 2;
      const PIH = Math.PI / 2;
      function mapCircleLink(node, percent, circle) {
        const radians = PI2 * (percent / 100);
        const radius = crv[circle] * 2;
        const x = Math.sin(radians) * radius;
        const y = Math.cos(radians) * radius;
        const lrm = (radians == PIH || radians == (Math.PI + PIH)) ?
         (0/*center*/) : ((
          (radians >= PIH) &&
          (radians <= (Math.PI + PIH))
        ) ? (-1/*left*/) : (+1/*right*/));
        const tbc = (radians == Math.PI || radians == PI2) ?
         (0/*center*/) : ((
          (radians <= Math.PI)
        ) ? (-1/*bottom*/) : (+1/*top*/));
        node.dataset.lrm = String(lrm);
        node.dataset.tbc = String(tbc);
        const left = ((x / canvas.width) * 28) + 50;
        const top = ((y / canvas.height) * 44) + 50;
        node.style.left = `${left}%`;
        node.style.top = `${top}%`;
        node.style.transform = `translate(-50%, -50%)`;
      }
      
      function generateLinkNodes() {
        for (let i = 0; i < links.length; ++i) {
          const map = Object.create(null);
          for (const link of links[i]) {
            const node = document.createElement('a');
            node.classList = 'circlelink';
            node.dataset.circle = String(i);
            node.href = link[2];
            node.textContent = link[1];
            document.body.appendChild(node);
            mapCircleLink(node, link[0], i);
            if (link[2].startsWith('#'))
              node.addEventListener('click', function(ev) {
                ev.preventDefault();
                return linkfns[this.href.slice(this.href.indexOf('#') + 1)](ev);
              });
            map[link[0]] = node;
          }
          linkmaps.push(map);
        }
      }
      function deleteLinkNodes() {
        document.querySelectorAll('a.circlelink').forEach(node => node.remove());
        linkmaps = [];
        links = [];
      }
      let hash = window.location.hash.trim();
      if (hash[0] === '#') hash = hash.slice(1, Infinity);
      if (hash === 'socials') {
        linkfns['main/socials']();
      } else {
        linkfns['main']();
        if (hash === 'about') linkfns['main/about']();
      }
    })();</script>
